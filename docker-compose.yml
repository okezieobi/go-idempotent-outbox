services:
  postgres:
    image: postgres:16-alpine
    container_name: outbox_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: outbox_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d outbox_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
